version: 2
# Minor and patch updates arrive as one pull request per ecosystem and week
# instead of one each. With every action and image pinned exactly, each
# patch is a pull request, and a single run of the checks covers them
# together. A major update still comes on its own, since that is where
# behaviour changes and it wants its own review.
updates:
  # "uv", not "pip": the versions actually installed are the ones pinned in
  # uv.lock, and the pip ecosystem does not read that file. Each pull
  # request rewrites uv.lock, so separate ones conflict after every merge.
  - package-ecosystem: "uv"
    directory: "/"
    # A version range stays as it is while it allows the new release, and
    # only uv.lock moves. A release outside the range changes the range.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # Always alone, whatever the size of the bump: the suite mocks the
        # REST API and does not see what the SDK changes, so it needs the
        # live check live/mailbox-mcp/mcp_stdio.py.
        exclude-patterns: ["mcp"]

  # The actions the workflows use, each pinned to a commit with its version
  # in a comment beside it. Dependabot raises the commit and the comment
  # together. The organisation's workflows and actions are followed at main
  # and kept current in benethos-hub/.github.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The base images of the three Dockerfiles (python, uv). A stale base
  # builds and runs without complaint, and ships unpatched packages.
  - package-ecosystem: "docker"
    directories:
      - "/containers/images/mailbox-service"
      - "/containers/images/mailbox-mcp"
      - "/containers/images/mailbox-agents"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The images of the compose files: Caddy and PostgreSQL in production,
  # Stalwart for the test mail server, PostgreSQL for the test database. Their tags name a
  # line without a digest, so a pull brings each fix within the line, also
  # to an operator who runs the compose file. Dependabot raises the tag
  # when a new line comes out, such as caddy 3 or Stalwart v1.3. A new
  # line of Caddy also changes setup.sh and the README of
  # containers/production/mailbox-service.
  - package-ecosystem: "docker-compose"
    directories:
      - "/containers/production/mailbox-service"
      - "/containers/test-mail-server"
      - "/containers/test-database"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The images of the agents' live setup: Stalwart, LiteLLM with Postgres
  # and llama.cpp, each pinned by digest beside its tag. The mailbox
  # service there is built from the checkout.
  - package-ecosystem: "docker-compose"
    directory: "/containers/live/mailbox-agents"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
