version: 2
updates:
  # "uv", not "pip": the versions actually installed are the ones pinned in
  # uv.lock, and the pip ecosystem does not read that file.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The base images of both Dockerfiles (python, uv). A stale base builds
  # and runs without complaint, and ships unpatched packages.
  - package-ecosystem: "docker"
    directories:
      - "/containers/benethos-mailbox-api"
      - "/containers/benethos-mailbox-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
