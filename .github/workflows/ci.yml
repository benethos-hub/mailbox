name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # brand, lint, test, coverage-badge, audit and the lowest-* jobs are the
  # organisation's reusable workflows in benethos-hub/.github, followed at
  # main. Each explains itself in its file. What stays here is what only
  # this project has: fresh-install and docker.

  # The organisation's check of assets/brand: the icon as icon.svg, and
  # icon.png and social-preview.png made from it, none older than it.
  brand:
    uses: benethos-hub/.github/.github/workflows/brand.yml@main

  # uv.lock in step with pyproject.toml, ruff, the formatting and mypy. The
  # tools come from the dependency group dev, which uv sync installs.
  lint:
    uses: benethos-hub/.github/.github/workflows/python-lint.yml@main

  # pytest on every supported Python against uv.lock, offline: providers are
  # faked and the MCP tests mock the REST API. The newest version measures
  # the coverage of the four packages, as [tool.coverage.run] names them,
  # and its floor. The versions are named here although they equal the
  # defaults: test_packaging.py holds them to the classifiers,
  # requires-python, fresh-install and the documentation.
  test:
    uses: benethos-hub/.github/.github/workflows/python-tests.yml@main
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      coverage-python: "3.15"
      badge: true

  # The coverage badge of the README, as coverage.json on the branch badges.
  # A push to main only, so it is no required check.
  coverage-badge:
    if: github.event_name == 'push'
    needs: test
    uses: benethos-hub/.github/.github/workflows/coverage-badge.yml@main
    permissions:
      contents: write # push coverage.json to the branch badges

  # Every version pinned in uv.lock, for every platform and Python, against
  # PyPI and OSV. A waiver in ignore-vulns belongs here, in the lowest-*
  # jobs and in publish.yml alike.
  audit:
    uses: benethos-hub/.github/.github/workflows/python-dependency-audit.yml@main

  # Every other job installs from uv.lock. A user installs from PyPI, where
  # only the declared ranges in pyproject.toml count, and most of them have
  # no upper bound. This job builds the four wheels and installs them into
  # a clean environment without the lockfile, then checks that both commands
  # start, the client imports, and the service still describes the same API.
  fresh-install:
    runs-on: ubuntu-latest
    # The newest tested version builds and installs the wheels.
    env:
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the four wheels
        run: uv build --all-packages --wheel

      - name: Install them into a clean environment (no lockfile) and start them
        run: |
          set -euo pipefail
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          echo "--- resolved dependency versions ---"
          uv pip list --python /tmp/fresh/bin/python
          echo "--- both commands start ---"
          /tmp/fresh/bin/benethos-mailbox-service --version
          /tmp/fresh/bin/benethos-mailbox-mcp --version
          /tmp/fresh/bin/benethos-mailbox-mcp --help > /dev/null
          /tmp/fresh/bin/python -c "import benethos_mailbox_client as c; print(c.__version__)"
          echo "--- the service describes the checked-in API ---"
          /tmp/fresh/bin/benethos-mailbox-service openapi > /tmp/openapi.json
          python3 - <<'PY'
          import json

          fresh = json.load(open("/tmp/openapi.json"))
          checked_in = json.load(open("docs/openapi.json"))
          assert fresh == checked_in, (
              "a fresh install describes another API than docs/openapi.json: "
              "a dependency outside uv.lock changes the contract"
          )
          print(f"OK: {len(fresh['paths'])} paths, same as docs/openapi.json")
          PY

  # The other side of fresh-install: the lowest versions pyproject.toml
  # allows, on the oldest supported Python, without the lockfile. An
  # environment that already holds an older fastapi or defusedxml keeps it,
  # as long as it meets the minimum. Dependabot moves uv.lock, never the
  # minimums, so they fall behind the code unnoticed. With audit, those
  # versions are checked against OSV as well: a minimum with a known
  # vulnerability lets someone install it. A failure here means raising a
  # minimum. One job per environment, each a required check. The tests run
  # from the root, so the pytest settings of pyproject.toml apply.
  lowest-versions:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: |
        packages/mailbox-service
        packages/mailbox-client
        packages/mailbox-mcp
        packages/mailbox-common[all]
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
      audit: true

  # Alone, the service may get older versions than beside the MCP server
  # and the client, with the extras of the common package it pins.
  lowest-service:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: |
        packages/mailbox-service
        packages/mailbox-common[paths,settings]
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
      pytest-args: packages/mailbox-service/tests
      audit: true

  # Alone, the MCP server may get older versions than beside the service.
  # The client and the common package it needs come from the repository:
  # they are released together.
  lowest-mcp:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: |
        packages/mailbox-client
        packages/mailbox-mcp
        packages/mailbox-common[all]
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
      pytest-args: packages/mailbox-mcp/tests
      audit: true

  # The client alone needs httpx and nothing else.
  lowest-client:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: packages/mailbox-client
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
      pytest-args: packages/mailbox-client/tests
      audit: true

  # The common package alone with every extra, on their lowest versions.
  lowest-common:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: packages/mailbox-common[all]
      requirements: pytest>=9.1.1
      pytest-args: packages/mailbox-common/tests
      audit: true

  # The common package without extras needs the standard library only,
  # and every group but those with an extra works.
  lowest-common-bare:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: packages/mailbox-common
      requirements: pytest>=9.1.1
      pytest-args: >-
        --ignore=packages/mailbox-common/tests/paths
        --ignore=packages/mailbox-common/tests/settings
        packages/mailbox-common/tests

  # Both images are built on every push, so a broken Dockerfile shows up
  # here and not first in a release.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build both images
        run: |
          set -euo pipefail
          docker build -t benethos-mailbox-service:ci -f containers/images/mailbox-service/Dockerfile .
          docker build -t benethos-mailbox-mcp:ci -f containers/images/mailbox-mcp/Dockerfile .

      # The compose files publish every port on the loopback address only
      # (CONCEPT 8.1). That is asserted here, so a change cannot drop it
      # unnoticed. The one exception is Caddy of the profile https in
      # production, which is there to listen on 80 and 443 everywhere.
      # Production is checked with the MCP server instances of its
      # example override file. Anyone running them may still publish
      # wider in their own copy or override file.
      - name: Compose files are valid and keep every port on the loopback address
        working-directory: containers
        run: |
          set -euo pipefail
          for place in development production; do
            mkdir -p "$place/secrets" && touch "$place/secrets/master_key"
            if [ -e "$place/.env.example" ]; then cp "$place/.env.example" "$place/.env"; fi
            if [ -e "$place/compose.override.yaml.example" ]; then
              cp "$place/compose.override.yaml.example" "$place/compose.override.yaml"
              echo "MAILBOX_DOMAIN=mailbox.example" >> "$place/.env"
              mkdir -p "$place/secrets/mcp"
              touch "$place/secrets/mcp/assistant.env" "$place/secrets/mcp/agent.env"
            fi
            (cd "$place" && docker compose --profile mcp --profile https config -q)
            (cd "$place" && docker compose --profile mcp --profile https config --format json) > "/tmp/$place.json"
            python3 - "$place" <<'PY'
          import json
          import sys

          place = sys.argv[1]
          # Who may listen on every address, and on which ports.
          public = {("production", "caddy"): {"80", "443"}}
          services = json.load(open(f"/tmp/{place}.json"))["services"]
          assert services, f"{place}: the compose file defines no services"
          for name, service in services.items():
              for port in service.get("ports") or []:
                  host_ip, published = port.get("host_ip"), str(port.get("published"))
                  if published in public.get((place, name), set()):
                      print(f"OK: {place} {name} publishes {published} everywhere, as meant")
                      continue
                  assert host_ip in ("127.0.0.1", "::1"), (
                      f"{place}: {name} publishes port {published} on "
                      f"{host_ip or 'every interface'}, not on the loopback address"
                  )
                  print(f"OK: {place} {name} publishes {host_ip}:{published}")
          PY
          done

      # The release publishes linux/arm64 as well. Build it here so that an
      # arm64-only break does not first surface in a release. Nothing is
      # loaded or pushed. Each cache scope is the image's name, which
      # publish/ghcr reads by default, so the release reuses these layers.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the service for arm64 as well
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/images/mailbox-service/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=benethos-mailbox-service
          cache-to: type=gha,mode=max,scope=benethos-mailbox-service

      - name: Build the MCP server for arm64 as well
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/images/mailbox-mcp/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=benethos-mailbox-mcp
          cache-to: type=gha,mode=max,scope=benethos-mailbox-mcp

      # The service starts from its image with a new master key, answers on
      # /health, keeps running, and its own health check agrees.
      - name: Smoke test (the service starts and is healthy)
        run: |
          set -euo pipefail
          name=benethos-mailbox-service-ci
          key=$(mktemp -d)/master_key
          docker run --rm benethos-mailbox-service:ci keys generate > "$key"
          chmod 444 "$key"

          # No --rm: a container that crashes stays, so its logs can be read.
          docker run -d --name "$name" -p 127.0.0.1:8080:8080 --read-only \
            --tmpfs /tmp -v "$key:/run/secrets/master_key:ro" benethos-mailbox-service:ci

          code=000
          for _ in $(seq 1 30); do
            # On a connection failure curl prints 000 and exits non-zero. The
            # fallback is an assignment outside the substitution.
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health) || code=000
            if [ "$code" != "000" ]; then
              break
            fi
            sleep 1
          done

          status=missing
          health=missing
          for _ in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Status}}' "$name") || status=missing
            health=$(docker inspect -f '{{.State.Health.Status}}' "$name") || health=missing
            if [ "$status" != "running" ] || [ "$health" != "starting" ]; then
              break
            fi
            sleep 3
          done

          docker logs "$name" || true
          echo "health endpoint: HTTP $code, container: $status, health check: $health"
          docker rm -f "$name" > /dev/null || true

          if [ "$code" != "200" ]; then
            echo "::error::/health answered $code"
            exit 1
          fi
          if [ "$status" != "running" ]; then
            echo "::error::the container is not running (status: $status)"
            exit 1
          fi
          if [ "$health" != "healthy" ]; then
            echo "::error::the container health check reports $health"
            exit 1
          fi

      - name: Smoke test (the MCP server image starts)
        run: docker run --rm benethos-mailbox-mcp:ci --version
