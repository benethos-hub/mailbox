name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # brand, lint, test, coverage-badge, audit, codeql, dockerfile-lint and the
  # lowest-* jobs are the organisation's reusable workflows in
  # benethos-hub/.github, followed at main. Each explains itself in its file.
  # What stays here is what only this project has: fresh-install, browser
  # and docker.

  # The organisation's check of assets/brand: the icon as icon.svg, and
  # icon.png and social-preview.png made from it, none older than it.
  brand:
    uses: benethos-hub/.github/.github/workflows/brand.yml@main

  # uv.lock in step with pyproject.toml, ruff, the formatting and mypy. The
  # tools come from the dependency group dev, which uv sync installs.
  lint:
    uses: benethos-hub/.github/.github/workflows/python-lint.yml@main

  # pytest on every supported Python against uv.lock, offline: providers are
  # faked and the MCP tests mock the REST API. The newest version measures
  # the coverage of the five packages, as [tool.coverage.run] names them,
  # and its floor. The versions are named here although they equal the
  # defaults: test_packaging.py holds them to the classifiers,
  # requires-python, fresh-install and the documentation.
  test:
    uses: benethos-hub/.github/.github/workflows/python-tests.yml@main
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      coverage-python: "3.15"
      badge: true

  # The coverage badge of the README, as coverage.json on the branch badges.
  # A push to main only, so it is no required check.
  coverage-badge:
    if: github.event_name == 'push'
    needs: test
    uses: benethos-hub/.github/.github/workflows/coverage-badge.yml@main
    permissions:
      contents: write # push coverage.json to the branch badges

  # Every version pinned in uv.lock, for every platform and Python, against
  # PyPI and OSV. A waiver in ignore-vulns belongs here, in the lowest-*
  # jobs, in publish.yml and in freshness.yml alike.
  audit:
    uses: benethos-hub/.github/.github/workflows/python-dependency-audit.yml@main

  # CodeQL on the Python code, the JavaScript of the UI and the workflows, with
  # the security and the quality queries. The findings go to Security, Code
  # scanning, and never fail this job, so it is no required check. codeql.yml
  # makes the same call once a week, for the queries GitHub adds in between.
  codeql:
    uses: benethos-hub/.github/.github/workflows/codeql.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      languages: python,javascript-typescript,actions
      config-file: .github/codeql/codeql-config.yml

  # Every other job installs from uv.lock. A user installs from PyPI, where
  # only the declared ranges in pyproject.toml count, and most of them have
  # no upper bound. This job builds the five wheels and installs them into
  # a clean environment without the lockfile, then checks that the commands
  # start, the client imports, and the service still describes the same API.
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The newest tested version builds and installs the wheels.
    env:
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build the five wheels
        run: uv build --all-packages --wheel

      - name: Install them into a clean environment (no lockfile) and start them
        run: |
          set -euo pipefail
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          echo "--- resolved dependency versions ---"
          uv pip list --python /tmp/fresh/bin/python
          echo "--- the commands start ---"
          /tmp/fresh/bin/benethos-mailbox-service --version
          /tmp/fresh/bin/benethos-mailbox-mcp --version
          /tmp/fresh/bin/benethos-mailbox-mcp --help > /dev/null
          /tmp/fresh/bin/benethos-mailbox-agents --version
          /tmp/fresh/bin/python -c "import benethos_mailbox_client as c; print(c.__version__)"
          echo "--- the service describes the checked-in API ---"
          /tmp/fresh/bin/benethos-mailbox-service openapi > /tmp/openapi.json
          python3 - <<'PY'
          import json

          fresh = json.load(open("/tmp/openapi.json"))
          checked_in = json.load(open("docs/mailbox-service/openapi.json"))
          assert fresh == checked_in, (
              "a fresh install describes another API than docs/mailbox-service/openapi.json: "
              "a dependency outside uv.lock changes the contract"
          )
          print(f"OK: {len(fresh['paths'])} paths, same as docs/mailbox-service/openapi.json")
          PY

  # The configuration UI in Chrome, Firefox and WebKit through Playwright:
  # the sign-in with a code goes on by itself through htmx, and no page
  # breaks the content security policy or misses a file of its own. The
  # other tests run no JavaScript. Playwright comes from the dependency
  # group browser, pinned in uv.lock.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.15"
      MAILBOX_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the three browsers and what they need of the system
        run: uv run --frozen --group browser playwright install --with-deps chromium firefox webkit

      - name: The UI in the three browsers
        run: uv run --frozen --group browser pytest packages/mailbox-service/tests/browser -p no:cacheprovider -n 0

  # The other side of fresh-install: the lowest versions pyproject.toml
  # allows, on the oldest supported Python, without the lockfile. An
  # environment that already holds an older fastapi or defusedxml keeps it,
  # as long as it meets the minimum. Dependabot moves uv.lock, never the
  # minimums, so they fall behind the code unnoticed. With audit, those
  # versions are checked against OSV as well: a minimum with a known
  # vulnerability lets someone install it. A failure here means raising a
  # minimum. One job per environment, each a required check. The tests run
  # from the root, so the pytest settings of pyproject.toml apply.
  lowest-versions:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: |
        packages/mailbox-service
        packages/mailbox-client
        packages/mailbox-mcp
        packages/mailbox-common[all]
        packages/mailbox-agents
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
        pytest-xdist>=3.8.0
      audit: true

  # Alone, the service may get older versions than beside the MCP server
  # and the client, with the extras of the common package it pins.
  lowest-service:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: |
        packages/mailbox-service
        packages/mailbox-common[paths,settings]
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
        pytest-xdist>=3.8.0
      pytest-args: packages/mailbox-service/tests
      audit: true

  # Alone, the MCP server may get older versions than beside the service.
  # The client and the common package it needs come from the repository:
  # they are released together.
  lowest-mcp:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: |
        packages/mailbox-client
        packages/mailbox-mcp
        packages/mailbox-common[all]
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
        pytest-xdist>=3.8.0
      pytest-args: packages/mailbox-mcp/tests
      audit: true

  # The client alone needs httpx and nothing else.
  # The agents alone, with the client they pin.
  lowest-agents:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: |
        packages/mailbox-client
        packages/mailbox-agents
        packages/mailbox-common[paths,settings]
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
        pytest-xdist>=3.8.0
      pytest-args: packages/mailbox-agents/tests
      audit: true

  lowest-client:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: packages/mailbox-client
      requirements: |
        pytest>=9.1.1
        pytest-asyncio>=1.4
        pytest-xdist>=3.8.0
      pytest-args: packages/mailbox-client/tests
      audit: true

  # The common package alone with every extra, on their lowest versions.
  lowest-common:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: packages/mailbox-common[all]
      requirements: |
        pytest>=9.1.1
        pytest-xdist>=3.8.0
      pytest-args: packages/mailbox-common/tests
      audit: true

  # The common package without extras needs the standard library only,
  # and every group but those with an extra works.
  lowest-common-bare:
    uses: benethos-hub/.github/.github/workflows/python-lowest-versions.yml@main
    with:
      python-version: "3.11"
      editable: packages/mailbox-common
      requirements: |
        pytest>=9.1.1
        pytest-xdist>=3.8.0
      pytest-args: >-
        --ignore=packages/mailbox-common/tests/paths
        --ignore=packages/mailbox-common/tests/settings
        packages/mailbox-common/tests

  # hadolint over every Dockerfile: an image without a tag, ADD where COPY would
  # do, no USER, the shell form of CMD, and ShellCheck over every RUN line. A
  # FROM from a registry other than the two named is a finding as well. The
  # findings go to Security, Code scanning, and this job stays green on them,
  # so it is no required check. The docker job below builds and runs the
  # images, this one reads the files.
  dockerfile-lint:
    uses: benethos-hub/.github/.github/workflows/dockerfile-lint.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      files: containers/**/Dockerfile
      trusted-registries: docker.io ghcr.io

  # The three images are built on every push, so a broken Dockerfile shows up
  # here and not first in a release.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the three images
        run: |
          set -euo pipefail
          docker build -t benethos-mailbox-service:ci -f containers/images/mailbox-service/Dockerfile .
          docker build -t benethos-mailbox-mcp:ci -f containers/images/mailbox-mcp/Dockerfile .
          docker build -t benethos-mailbox-agents:ci -f containers/images/mailbox-agents/Dockerfile .

      # The compose files publish every port on the loopback address only
      # (CONCEPT 8.1). That is asserted here, so a change cannot drop it
      # unnoticed. The one exception is Caddy of the profile https in
      # production, which is there to listen on 80 and 443 everywhere.
      # Production is checked with the MCP server instances of its
      # example override file. Anyone running them may still publish
      # wider in their own copy or override file.
      - name: Compose files are valid and keep every port on the loopback address
        working-directory: containers
        run: |
          set -euo pipefail
          # A folder per place and package. The place decides who may
          # listen on every address.
          for folder in development/mailbox-service production/mailbox-service; do
            place="${folder%%/*}"
            mkdir -p "$folder/secrets" && touch "$folder/secrets/master_key"
            if [ -e "$folder/.env.example" ]; then cp "$folder/.env.example" "$folder/.env"; fi
            if [ -e "$folder/compose.override.yaml.example" ]; then
              cp "$folder/compose.override.yaml.example" "$folder/compose.override.yaml"
              echo "MAILBOX_DOMAIN=mailbox.example" >> "$folder/.env"
              for instance in assistant agent; do
                mkdir -p "$folder/secrets/mcp/$instance"
                touch "$folder/secrets/mcp/$instance/service_token" "$folder/secrets/mcp/$instance/bearer_token"
              done
            fi
            (cd "$folder" && docker compose --profile mcp --profile https config -q)
            (cd "$folder" && docker compose --profile mcp --profile https config --format json) > "/tmp/compose.json"
            python3 - "$place" "$folder" <<'PY'
          import json
          import sys

          place, folder = sys.argv[1], sys.argv[2]
          # Who may listen on every address, and on which ports.
          public = {("production", "caddy"): {"80", "443"}}
          services = json.load(open("/tmp/compose.json"))["services"]
          assert services, f"{folder}: the compose file defines no services"
          for name, service in services.items():
              for port in service.get("ports") or []:
                  host_ip, published = port.get("host_ip"), str(port.get("published"))
                  if published in public.get((place, name), set()):
                      print(f"OK: {folder} {name} publishes {published} everywhere, as meant")
                      continue
                  assert host_ip in ("127.0.0.1", "::1"), (
                      f"{folder}: {name} publishes port {published} on "
                      f"{host_ip or 'every interface'}, not on the loopback address"
                  )
                  print(f"OK: {folder} {name} publishes {host_ip}:{published}")
          PY
          done

      # The agents' image runs as uid 10001, starts, and every agent is in
      # it. The agents need a mailbox service to do more, which the live
      # checks of live/mailbox-agents/ bring, by hand.
      - name: The agents' image starts and holds every agent
        run: |
          set -euo pipefail
          user=$(docker inspect -f '{{.Config.User}}' benethos-mailbox-agents:ci)
          if [ "$user" != "10001" ]; then
            echo "::error::the image runs as '$user', not as 10001"
            exit 1
          fi
          docker run --rm --network none benethos-mailbox-agents:ci --help > /dev/null
          docker run --rm --network none --entrypoint python benethos-mailbox-agents:ci -c "
          from benethos_mailbox_agents.contract import discover
          names = sorted(discover())
          assert names == ['awaiting_reply', 'categorization', 'counting', 'inquiries', 'invoices'], names
          print('OK: the image runs as 10001 and holds', ', '.join(names))
          "

      # The agents' compose files, read as compose resolves them with every
      # profile: valid, every published port on the loopback address, as
      # the metrics have no authentication, and each folder what its name
      # says: development builds from the checkout, production pulls the
      # published image, and both keep the root file system read-only and
      # drop every capability. Empty files stand in for the settings
      # compose reads, which are not versioned.
      - name: The agents' compose files are valid, loopback only, and what their folder says
        run: |
          set -euo pipefail
          mkdir -p containers/live/mailbox-agents/secrets
          touch containers/live/mailbox-agents/secrets/agent.env
          for agent in counting invoices awaiting_reply inquiries categorization; do
            touch "containers/production/mailbox-agents/agents/$agent/.env"
          done
          docker compose -f containers/development/mailbox-agents/compose.yaml \
            --profile invoices --profile categorization config --format json > /tmp/development.json
          docker compose -f containers/production/mailbox-agents/compose.yaml \
            --env-file containers/production/mailbox-agents/.env.example \
            --profile counting --profile invoices --profile awaiting_reply \
            --profile inquiries --profile categorization \
            config --format json > /tmp/production.json
          python3 - <<'PY'
          import json

          AGENTS = {"counting", "invoices", "awaiting_reply", "inquiries", "categorization"}
          for folder in ("development", "production"):
              services = json.load(open(f"/tmp/{folder}.json"))["services"]
              assert services, f"the agents' {folder} compose file defines no services"
              if folder == "production":
                  assert set(services) == AGENTS, f"production runs {sorted(services)}"
              for name, service in services.items():
                  where = f"{folder}/mailbox-agents: {name}"
                  for port in service.get("ports") or []:
                      host_ip = port.get("host_ip")
                      assert host_ip in ("127.0.0.1", "::1"), (
                          f"{where} publishes port {port.get('published')} on "
                          f"{host_ip or 'every interface'}, not on the loopback address"
                      )
                  assert service.get("read_only") is True, f"{where} is not read-only"
                  assert service.get("cap_drop") == ["ALL"], f"{where} keeps capabilities"
                  if folder == "development":
                      assert "build" in service, f"{where} does not build from the checkout"
                  else:
                      assert "build" not in service, f"{where} builds instead of pulling"
                      assert service["image"].startswith(
                          "ghcr.io/benethos-hub/benethos-mailbox-agents:"
                      ), f"{where} runs {service['image']}, not the published image"
                  print(f"OK: {where} is loopback only, read-only and "
                        f"{'builds' if folder == 'development' else 'pulls'}")
          PY

      # The release publishes linux/arm64 as well. Build it here so that an
      # arm64-only break does not first surface in a release. Nothing is
      # loaded or pushed. Each cache scope is the image's name, which
      # publish/ghcr reads by default, so the release reuses these layers.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the service for arm64 as well
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/images/mailbox-service/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=benethos-mailbox-service
          cache-to: type=gha,mode=max,scope=benethos-mailbox-service

      - name: Build the MCP server for arm64 as well
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/images/mailbox-mcp/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=benethos-mailbox-mcp
          cache-to: type=gha,mode=max,scope=benethos-mailbox-mcp

      - name: Build the agents for arm64 as well
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/images/mailbox-agents/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=benethos-mailbox-agents
          cache-to: type=gha,mode=max,scope=benethos-mailbox-agents

      # The service starts from its image with a new master key, answers on
      # /health, keeps running, and its own health check agrees.
      - name: Smoke test (the service starts and is healthy)
        run: |
          set -euo pipefail
          name=benethos-mailbox-service-ci
          key=$(mktemp -d)/master_key
          docker run --rm benethos-mailbox-service:ci keys generate > "$key"
          chmod 444 "$key"

          # No --rm: a container that crashes stays, so its logs can be read.
          docker run -d --name "$name" -p 127.0.0.1:8080:8080 --read-only \
            --tmpfs /tmp -v "$key:/run/secrets/master_key:ro" benethos-mailbox-service:ci

          code=000
          for _ in $(seq 1 30); do
            # On a connection failure curl prints 000 and exits non-zero. The
            # fallback is an assignment outside the substitution.
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health) || code=000
            if [ "$code" != "000" ]; then
              break
            fi
            sleep 1
          done

          status=missing
          health=missing
          for _ in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Status}}' "$name") || status=missing
            health=$(docker inspect -f '{{.State.Health.Status}}' "$name") || health=missing
            if [ "$status" != "running" ] || [ "$health" != "starting" ]; then
              break
            fi
            sleep 3
          done

          docker logs "$name" || true
          echo "health endpoint: HTTP $code, container: $status, health check: $health"
          docker rm -f "$name" > /dev/null || true

          if [ "$code" != "200" ]; then
            echo "::error::/health answered $code"
            exit 1
          fi
          if [ "$status" != "running" ]; then
            echo "::error::the container is not running (status: $status)"
            exit 1
          fi
          if [ "$health" != "healthy" ]; then
            echo "::error::the container health check reports $health"
            exit 1
          fi

      - name: Smoke test (the MCP server image starts)
        run: docker run --rm benethos-mailbox-mcp:ci --version

      # What a directory such as Glama sees: the image in a sandbox, no
      # service, no token, the tool list read over stdio. It must hold
      # every tool of docs/mailbox-mcp/mcp-tools.json, the tools as a client lists them.
      - name: Smoke test (the MCP server image lists every tool as a catalogue)
        run: |
          expected=$(jq length docs/mailbox-mcp/mcp-tools.json)
          # stdin stays open until the answer is read. At the end of its
          # input the server ends the session, as MCP's stdio shutdown
          # has it, and drops a request still running.
          coproc MCP {
            timeout 60 docker run -i --rm -e MAILBOX_MCP_CATALOGUE=true \
              benethos-mailbox-mcp:ci --transport stdio
          }
          pid=$MCP_PID
          exec {from_server}<&"${MCP[0]}" {to_server}>&"${MCP[1]}"
          eval "exec ${MCP[0]}<&- ${MCP[1]}>&-"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            >&"$to_server"
          listed=0
          while IFS= read -r line <&"$from_server"; do
            answer=$(jq -c 'select(.id == 2)' <<<"$line")
            if [ -n "$answer" ]; then
              listed=$(jq '.result.tools | length' <<<"$answer")
              break
            fi
          done
          exec {to_server}>&- {from_server}<&-
          wait "$pid" || true
          echo "listed $listed tools, docs/mailbox-mcp/mcp-tools.json names $expected"
          if [ "$listed" != "$expected" ]; then
            echo "::error::the catalogue lists $listed tools, docs/mailbox-mcp/mcp-tools.json names $expected"
            exit 1
          fi
