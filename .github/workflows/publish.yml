name: Publish

# Publishes a release: the four packages to PyPI, both images to ghcr.io,
# the MCP server's Claude Desktop bundle onto the release, and its entry in
# the MCP Registry. Each upload is done by an action of the organisation in
# benethos-hub/.github (actions/publish), followed at main like the CI
# workflows. Its README describes the gate, the trial run, the release tags
# and the one-time setup. What follows is what this project adds.
#
# Four packages carry one version, and the release tag names it. They go
# to PyPI in the order of their dependencies, one job each, since a package
# on PyPI that pins one not yet there cannot be installed: common first,
# then client and service, then mcp. test_publish.py holds that order to
# the pyproject files. PyPI trusts this file, publish.yml, together with
# the environment pypi-<package> of each job. Renaming either has PyPI
# refuse the next upload.
#
# Two images, benethos-mailbox-service and benethos-mailbox-mcp, from one
# matrix. The client and the common package have no image.
#
# The bundle pins the MCP server's version on PyPI, so it is locked and
# packed once that version is there, and the registry entry waits for it.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Waits up to 30 minutes for the CI run of ci.yml on main for this commit,
  # and stops the release when that run failed, or after five minutes when
  # there is none. On a branch other than main nothing would be built, so it
  # does not run there. A waiver in ignore-vulns belongs here and in ci.yml
  # alike.
  ci-passed:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    uses: benethos-hub/.github/.github/workflows/python-release-ci-passed.yml@main
    permissions:
      actions: read # list the CI runs of this commit
      contents: read
    with:
      audit: true

  # The wheel must carry the PEP 561 marker, which makes type checkers read
  # the installed package, and the license text. Neither would fail a test
  # or the build. A version may be uploaded once only, so never by hand.
  pypi-common:
    name: PyPI benethos-mailbox-common
    if: github.event_name == 'release'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-benethos-mailbox-common
      url: https://pypi.org/p/benethos-mailbox-common
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          package: benethos-mailbox-common
          wheel-contains: |
            benethos_mailbox_common/py.typed
            benethos_mailbox_common-{version}.dist-info/licenses/LICENSE

  # The client waits for the common package too, so it may come to need it.
  pypi-client:
    name: PyPI benethos-mailbox-client
    if: github.event_name == 'release'
    needs: [ci-passed, pypi-common]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-benethos-mailbox-client
      url: https://pypi.org/p/benethos-mailbox-client
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          package: benethos-mailbox-client
          wheel-contains: |
            benethos_mailbox_client/py.typed
            benethos_mailbox_client-{version}.dist-info/licenses/LICENSE

  pypi-service:
    name: PyPI benethos-mailbox-service
    if: github.event_name == 'release'
    needs: [ci-passed, pypi-common]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-benethos-mailbox-service
      url: https://pypi.org/p/benethos-mailbox-service
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          package: benethos-mailbox-service
          wheel-contains: |
            benethos_mailbox_service/py.typed
            benethos_mailbox_service-{version}.dist-info/licenses/LICENSE

  pypi-mcp:
    name: PyPI benethos-mailbox-mcp
    if: github.event_name == 'release'
    needs: [ci-passed, pypi-client, pypi-common]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-benethos-mailbox-mcp
      url: https://pypi.org/p/benethos-mailbox-mcp
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          package: benethos-mailbox-mcp
          wheel-contains: |
            benethos_mailbox_mcp/py.typed
            benethos_mailbox_mcp-{version}.dist-info/licenses/LICENSE

  # The PyPI half of a manual run, for all four packages, without the
  # environments and without an OIDC token, since nothing is uploaded.
  pypi-trial:
    name: PyPI ${{ matrix.package }} (trial)
    if: github.event_name == 'workflow_dispatch'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: benethos-mailbox-common
            module: benethos_mailbox_common
          - package: benethos-mailbox-client
            module: benethos_mailbox_client
          - package: benethos-mailbox-service
            module: benethos_mailbox_service
          - package: benethos-mailbox-mcp
            module: benethos_mailbox_mcp
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          dry-run: true
          package: ${{ matrix.package }}
          wheel-contains: |
            ${{ matrix.module }}/py.typed
            ${{ matrix.module }}-{version}.dist-info/licenses/LICENSE

  # A release, or a manual run on main, which pushes edge. edge is public,
  # and the form offers every branch. arm64 is emulated on the amd64
  # runner, and the dependencies ship aarch64 wheels. The docker job of
  # ci.yml builds arm64 into the cache scope of each image's name, which
  # the action reads by default.
  ghcr-publish:
    name: Image ${{ matrix.image }}
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: benethos-mailbox-service
            folder: mailbox-service
            description: "Mailbox, mailbox-service: one REST API for several mail providers and accounts."
          - image: benethos-mailbox-mcp
            folder: mailbox-mcp
            description: "Mailbox, mailbox-mcp: the MCP server over streamable HTTP. Reaches mail through the REST API of mailbox-service only."
    permissions:
      contents: read
      packages: write # push to ghcr.io as the GITHUB_TOKEN identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benethos-hub/.github/actions/publish/ghcr@main
        with:
          image: ${{ matrix.image }}
          dockerfile: containers/images/${{ matrix.folder }}/Dockerfile
          description: ${{ matrix.description }}
          version-file: packages/${{ matrix.folder }}/pyproject.toml

  # The Claude Desktop bundle of the MCP server, .github/publish/mcpb/. It
  # pins the MCP server's version on PyPI, so it is staged and locked here
  # once that version is uploaded, and the action packs and attaches it.
  mcpb-bundle:
    name: Claude Desktop bundle
    if: github.event_name == 'release'
    needs: [pypi-mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the bundle to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token is for the upload, nothing here pushes.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Stage the bundle
        run: uv run --no-project .github/publish/mcpb/build.py "$RUNNER_TEMP/bundle"

      # PyPI's index can name a fresh upload a little later than the upload.
      - name: Lock it to the version on PyPI
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if uv lock --directory "$RUNNER_TEMP/bundle" --refresh-package benethos-mailbox-mcp; then
              exit 0
            fi
            echo "attempt ${attempt} found no release yet, trying again in 30 s"
            sleep 30
          done
          exit 1

      # Attached twice, under its version and without, which gives the
      # README a link that always reaches the newest full release.
      - uses: benethos-hub/.github/actions/publish/mcpb@main
        with:
          staged: ${{ runner.temp }}/bundle
          name: benethos-mailbox-mcp

  # The MCP server's entry, .github/publish/mcp-registry/server.json. The
  # registry checks each package when it takes the entry: the README of
  # this version on PyPI must carry the mcp-name line, and the bundle must
  # be on the release with its checksum. The entry lists no image. An entry
  # cannot be taken back, so a pre-release never gets one.
  mcp-registry:
    name: MCP Registry
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [pypi-mcp, mcpb-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the registry grants io.github.benethos-hub/* to this token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: benethos-hub/.github/actions/publish/mcp-registry@main
