# For development: the service, and the MCP server with the profile mcp,
# built from this repository and bound to the loopback address of the host
# (CONCEPT 8.1). To run the published images instead: ../production/.
# The first start takes the steps of ../production/README.md, run in this
# folder after `docker compose build`. The master key lives in
# secrets/master_key here, not versioned.

name: mailbox-dev

# Docker keeps what a container writes to stderr, and the service writes a
# line per request. Without a cap the log grows for as long as the container
# runs: at most 5 files of 10 MB each, the oldest dropped first.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mailbox-service:
    image: benethos-mailbox-service:local
    logging: *logging
    build:
      context: ../..
      dockerfile: containers/images/mailbox-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILBOX_SERVICE_PORT:-8080}:8080"
    volumes:
      - data:/data
    secrets:
      - master_key
    environment:
      MAILBOX_SERVICE_LOG_LEVEL: ${MAILBOX_SERVICE_LOG_LEVEL:-INFO}
      MAILBOX_SERVICE_SYNC_INTERVAL: ${MAILBOX_SERVICE_SYNC_INTERVAL:-300}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The MCP server over streamable HTTP, started with the profile `mcp`:
  #   docker compose --profile mcp up -d
  # It needs MAILBOX_SERVICE_TOKEN (the API token of the user it acts as) and
  # MAILBOX_MCP_BEARER_TOKEN (what its own clients must send).
  mailbox-mcp:
    profiles: [mcp]
    image: benethos-mailbox-mcp:local
    logging: *logging
    build:
      context: ../..
      dockerfile: containers/images/mailbox-mcp/Dockerfile
    restart: unless-stopped
    depends_on:
      mailbox-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MAILBOX_MCP_PORT:-8000}:8000"
    environment:
      MAILBOX_SERVICE_URL: http://mailbox-service:8080
      # Plain http inside the compose network, which only the two join.
      MAILBOX_SERVICE_ALLOW_HTTP: "1"
      MAILBOX_SERVICE_TOKEN: ${MAILBOX_SERVICE_TOKEN:-}
      MAILBOX_MCP_BEARER_TOKEN: ${MAILBOX_MCP_BEARER_TOKEN:-}
      # The Host values clients use: the port as published on the host.
      MAILBOX_MCP_ALLOWED_HOSTS: ${MAILBOX_MCP_ALLOWED_HOSTS:-127.0.0.1:${MAILBOX_MCP_PORT:-8000},localhost:${MAILBOX_MCP_PORT:-8000}}
      MAILBOX_MCP_LOG_LEVEL: ${MAILBOX_MCP_LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  master_key:
    file: ./secrets/master_key

volumes:
  data:
