# For development: the image built from this checkout, run against the
# test account of ../../live/mailbox-agents, never against a real mailbox. A project, volumes
# and ports of its own. It joins the network of the live setup, so start
# that first: sh containers/live/mailbox-agents/setup.sh
#
#   docker compose up -d --build                    the agent counting
#   docker compose --profile categorization up -d   an agent that asks a model,
#                                                   with the gateway in ./.env
#   docker compose exec counting benethos-mailbox-agents report --agent counting
#   docker compose --profile cockpit up -d cockpit  the cockpit, by hand, with
#                                                   its secret in ./secrets/
#   docker compose down -v                          stop, and forget the volumes
#
# Why each setting is what it is: ../../production/mailbox-agents/compose.yaml.

name: benethos-mailbox-agents-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-agent: &agent
  build:
    context: ../../..
    dockerfile: containers/images/mailbox-agents/Dockerfile
  image: benethos-mailbox-agents:local
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - live
  env_file:
    # The test account, its token and the stage shadow, made by setup.sh.
    - path: ../../live/mailbox-agents/secrets/agent.env
      required: true
    # The gateway, for an agent that asks a model:
    # MAILBOX_AGENTS_GATEWAY_URL, MAILBOX_AGENTS_GATEWAY_KEY and
    # MAILBOX_AGENTS_MODEL. Not versioned, and not needed by counting.
    - path: ./.env
      required: false
  environment: &environment
    # The service by its name on the live network, over http between two
    # containers, which the client refuses unless it is allowed.
    MAILBOX_AGENTS_SERVICE_URL: http://mailbox-service:8080
    MAILBOX_AGENTS_SERVICE_ALLOW_HTTP: "true"
    # The gateway too, when ./.env names it by its name on the network.
    MAILBOX_AGENTS_GATEWAY_ALLOW_HTTP: "true"
    MAILBOX_AGENTS_DATA_DIR: /data
    MAILBOX_AGENTS_POLL_SECONDS: "15"

services:
  counting:
    <<: *agent
    command: ["worker", "--agent", "counting"]
    volumes:
      - counting-data:/data
    ports:
      - "127.0.0.1:${MAILBOX_AGENTS_COUNTING_METRICS_PORT:-9480}:9464"
    healthcheck:
      test: ["CMD", "benethos-mailbox-agents", "health", "--agent", "counting"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Asks the model of ./.env for the groups with a topic. Writes to the
  # test account in the stage full only.
  categorization:
    <<: *agent
    profiles: ["categorization"]
    command: ["worker", "--agent", "categorization"]
    environment:
      <<: *environment
      MAILBOX_AGENTS_CATEGORIZATION_FILE: /config/categorization.json
    volumes:
      - categorization-data:/data
      - ../../live/mailbox-agents/categorization.json:/config/categorization.json:ro
    ports:
      - "127.0.0.1:${MAILBOX_AGENTS_CATEGORIZATION_METRICS_PORT:-9482}:9464"
    healthcheck:
      test: ["CMD", "benethos-mailbox-agents", "health", "--agent", "categorization"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # The read-only pages of what both agents did, started by hand and never
  # again by itself, with the secret of ./secrets/cockpit_secret, which is
  # not versioned. It shows subject and sender with the token of the test
  # account.
  cockpit:
    <<: *agent
    restart: "no"
    profiles: ["cockpit"]
    command: ["cockpit"]
    environment:
      <<: *environment
      MAILBOX_AGENTS_DATA_DIR: /state
      MAILBOX_AGENTS_COCKPIT_HOST: 0.0.0.0
      MAILBOX_AGENTS_COCKPIT_SECRET_FILE: /run/secrets/cockpit_secret
    volumes:
      - counting-data:/state/counting:ro
      - categorization-data:/state/categorization:ro
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:${MAILBOX_AGENTS_COCKPIT_PORT:-9490}:9480"

networks:
  live:
    name: mailbox-agents-live_live
    external: true

volumes:
  counting-data:
  categorization-data:
