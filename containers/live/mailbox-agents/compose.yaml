# A mail server, a mailbox service and a model gateway of their own, for
# the live checks, and Jaeger, Prometheus and Grafana to look at the agents.
# Nothing here reaches a real mailbox: Stalwart holds one account made for
# the agents, filled with invented mail, and the service is built from
# this checkout. setup.sh makes it, README.md says how to use it, and
# live/mailbox-agents/agents_smoke.py checks the package against it. Every port is on
# 127.0.0.1 only.
name: mailbox-agents-live

services:
  stalwart:
    image: stalwartlabs/stalwart:v1.2.1@sha256:ed3153af935f0125ed0424b2a6d7d5891915a9249189dda76860a27f906b64ea
    init: true
    restart: unless-stopped
    environment:
      # Set by setup.sh for the first start only, then empty.
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-}
    networks:
      live:
        aliases:
          - mail.agents.test
    ports:
      - "127.0.0.1:38080:8080"
      - "127.0.0.1:38465:465"
      - "127.0.0.1:38993:993"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

  # Built from this checkout, so it is the version of the agents beside it,
  # also on a branch before a release. compose.published.yaml takes the
  # published image instead (MAILBOX_LIVE_SERVICE=published, README.md).
  mailbox-service:
    image: benethos-mailbox-service:local
    build:
      context: ../../..
      dockerfile: containers/images/mailbox-service/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # The mail server's name resolves to a private address, which the
      # service refuses unless it is named here.
      MAILBOX_SERVICE_DISCOVERY_INTERNAL_HOSTS: '["mail.agents.test"]'
      # The service checks every certificate. This one trusts the test CA.
      SSL_CERT_FILE: /run/secrets/ca.pem
      MAILBOX_SERVICE_SYNC_INTERVAL: "30"
      MAILBOX_SERVICE_RATE_LIMIT_PER_MINUTE: "0"
    networks:
      - live
    ports:
      - "127.0.0.1:38081:8080"
    volumes:
      - service-data:/data
      - ./secrets/master_key:/run/secrets/master_key:ro
      - ./secrets/tls/ca.pem:/run/secrets/ca.pem:ro

  # The model gateway: LiteLLM, its aliases in litellm.yaml, its master key,
  # the Claude API key and the address of its database in
  # secrets/gateway.env, made by setup.sh. The image with the database
  # client built in: the web interface signs in only with a database.
  gateway:
    image: ghcr.io/berriai/litellm-database:1.110.4@sha256:d8cd8c5b8bde7e3959b22f5adbd5492d5a12be143173ebb1c7a4f30d07028005
    restart: unless-stopped
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    env_file: ./secrets/gateway.env
    depends_on:
      gateway-db:
        condition: service_healthy
    networks:
      - live
      - models
      - gateway-db
    ports:
      - "127.0.0.1:38400:4000"
    volumes:
      - ./litellm.yaml:/etc/litellm/config.yaml:ro
    healthcheck:
      # The image has Python but no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # The gateway's database: its keys and what each spent, for its web
  # interface. No prompt and no answer, litellm.yaml says so. Reached by
  # the gateway alone, on a network with no way out. The volume sits at
  # /var/lib/postgresql, the data in a folder per major version below it,
  # so a new major starts with an empty database and leaves the folder of
  # the old one unread. After a change of major, run setup.sh: it removes
  # the volume, the gateway sets its tables up anew, and the agents get a
  # new key.
  gateway-db:
    image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    restart: unless-stopped
    env_file: ./secrets/gateway-db.env
    networks:
      - gateway-db
    volumes:
      - gateway-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # Local models under llama.cpp, one router per kind of hardware. Each
  # serves the models of its presets file, one at a time, and loads a model
  # on its first request. fetch-models.sh fetches the files into ./models,
  # which a new setup keeps. Neither service has a port or a way out: the
  # gateway is the only one to reach them.

  # On the graphics card, with the profile gpu. Needs the NVIDIA Container
  # Toolkit and its CDI spec on the host (README.md).
  llama-gpu:
    profiles: ["gpu"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12767@sha256:d3160910fcaebaf9a6223a5cb7ca8305b5530af2c740884b0ec3789761580273
    restart: unless-stopped
    command: &llama-command
      - --models-preset
      - /etc/llama/presets.ini
      - --models-max
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    devices:
      - nvidia.com/gpu=all
    networks:
      - models
    volumes:
      - ./models:/models:ro
      - ./llama/presets-gpu.ini:/etc/llama/presets.ini:ro
    healthcheck: &llama-health
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # On the CPU, with the profile cpu: what a server without a card would do.
  llama-cpu:
    profiles: ["cpu"]
    image: ghcr.io/ggml-org/llama.cpp:server-b12767@sha256:b24873ae66a4732e0b4b66dd7dc658066ccad6e8c63524278e92eebc767aacbe
    restart: unless-stopped
    command: *llama-command
    networks:
      - models
    volumes:
      - ./models:/models:ro
      - ./llama/presets-cpu.ini:/etc/llama/presets.ini:ro
    healthcheck: *llama-health

  # A target for the agents' spans and a web interface to look at them:
  # Jaeger, all in one, its traces in memory only, so a restart empties
  # it. The agents send their spans over OTLP and HTTP to port 38318 when
  # agent.env names it, as provision.py writes it.
  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    restart: unless-stopped
    networks:
      - observability
    ports:
      - "127.0.0.1:38686:16686"
      - "127.0.0.1:38318:4318"

  # The agents' metrics: Prometheus scrapes a worker on this machine, as
  # metrics-targets.sh names its address, every 15 seconds. Its data
  # lies in the container, so a new container starts empty.
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    networks:
      - observability
    ports:
      - "127.0.0.1:38090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro

  # Dashboards over Prometheus, entered by the files in grafana/, with
  # the dashboard of the agents. The password of the user
  # admin in secrets/grafana.env, made by setup.sh. Nothing reports home:
  # no usage statistics, no check for updates, no news, no plugin
  # installed from the internet.
  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    restart: unless-stopped
    env_file: ./secrets/grafana.env
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      - prometheus
    networks:
      - observability
    ports:
      - "127.0.0.1:38300:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

networks:
  live:
  # Jaeger, Prometheus and Grafana. A network with no way out would
  # publish no port, and Prometheus reaches the worker on this machine.
  observability:
  # Shared by the gateway and the llama services only, with no way out.
  models:
    internal: true
  # Shared by the gateway and its database only, with no way out.
  gateway-db:
    internal: true

volumes:
  gateway-db:
  stalwart-etc:
  stalwart-data:
  service-data:
