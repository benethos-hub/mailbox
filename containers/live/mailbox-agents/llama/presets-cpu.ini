; The models of the service llama-cpu, one section each. A section's name is
; the model's name at the router and in litellm.yaml, and its file is
; /models/<name>.gguf, fetched by fetch-models.sh. Keys are the options of
; llama-server without their dashes.
;
; The CPU instance stands for a server without a graphics card. Small dense
; models answer in seconds, a mixture of experts with few active
; parameters is the larger choice that still runs there.

version = 1

[*]
; One request at a time: the agents call one after the other, and every
; slot would take its share of the context.
parallel = 1
ctx-size = 8192
cache-type-k = q8_0
cache-type-v = q8_0
; The agents want a value in a schema, not a train of thought. A thinking
; model answers without one.
reasoning = off
no-context-shift = true

[qwen3-4b-2507]
model = /models/qwen3-4b-2507.gguf

[qwen3.5-4b]
model = /models/qwen3.5-4b.gguf

[gemma-4-e4b]
model = /models/gemma-4-e4b.gguf

; 35B parameters, 3B of them active for each token: slower to read a mail
; than a 4B model, but far more knowledge, in 22 GB of main memory.
[qwen3.6-35b-a3b]
model = /models/qwen3.6-35b-a3b.gguf
