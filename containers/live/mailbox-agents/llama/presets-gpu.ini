; The models of the service llama-gpu, one section each. A section's name is
; the model's name at the router and in litellm.yaml, and its file is
; /models/<name>.gguf, fetched by fetch-models.sh. Keys are the options of
; llama-server without their dashes.
;
; The card has 12 GB. Unset placement options are left to llama-server's
; --fit, which keeps a margin free on the card and moves what does not fit
; to the CPU: whole layers of a dense model, the expert weights of a
; mixture of experts.

version = 1

[*]
; One request at a time: the agents call one after the other, and every
; slot would take its share of the context.
parallel = 1
ctx-size = 16384
; The key and value cache in 8 bits takes half the memory of 16 bits.
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
; The agents want a value in a schema, not a train of thought. A thinking
; model answers without one.
reasoning = off
no-context-shift = true

[ministral-3-8b]
model = /models/ministral-3-8b.gguf

[qwen3.5-9b]
model = /models/qwen3.5-9b.gguf

[gemma-4-12b]
model = /models/gemma-4-12b.gguf

; 35B parameters, 3B of them active for each token. 22 GB do not fit the
; card, so --fit keeps the experts of some layers in main memory.
[qwen3.6-35b-a3b]
model = /models/qwen3.6-35b-a3b.gguf
