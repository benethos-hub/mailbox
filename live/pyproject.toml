# The live checks, not a distribution: installed into the development
# environment as an editable project (the dev group of the root), so
# that a script in live/<package>/ finds live/common/ without a line of
# its own. A script finds the shared folder beside it, such as
# service_common/, as Python finds every folder beside a script.
# Never published.

[project]
name = "mailbox-live"
version = "0"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
