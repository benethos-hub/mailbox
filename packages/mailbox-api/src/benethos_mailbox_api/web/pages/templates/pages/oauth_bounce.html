{% extends "bare.html" %}
{% block head %}
{# From this site, so the browser sends the session cookie again. #}
<meta http-equiv="refresh" content="0;url={{ target }}" />
<meta name="referrer" content="no-referrer" />
{% endblock %}
{% block title %}Signing in · {{ APP_NAME }}{% endblock %}
{% block content %}
<p>Back from the sign-in. One moment…</p>
<p><a class="btn primary" href="{{ target }}">Continue</a></p>
{% endblock %}
