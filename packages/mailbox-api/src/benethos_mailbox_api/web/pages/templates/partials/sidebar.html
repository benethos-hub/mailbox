{% from "components/ui.html" import csrf_field with context %}
<aside class="sidebar">
  <div class="brand"><span class="mark">✉</span> {{ APP_NAME }}</div>
  <nav class="nav">
    <a href="/ui" class="{{ 'active' if page == 'home' }}"><span class="icon">◫</span> Overview</a>
    <a href="/ui/mail" class="{{ 'active' if page == 'mail' }}"><span class="icon">✉</span> Mail</a>
    <div class="section">Service</div>
    <a href="/ui/accounts" class="{{ 'active' if page == 'accounts' }}"><span class="icon">▤</span> Accounts</a>
    <a href="/ui/sends" class="{{ 'active' if page == 'sends' }}"><span class="icon">⇢</span> Sends</a>
    <div class="section">Access</div>
    <a href="/ui/users" class="{{ 'active' if page == 'users' }}"><span class="icon">☺</span> Users</a>
    <a href="/ui/roles" class="{{ 'active' if page == 'roles' }}"><span class="icon">◈</span> Roles</a>
  </nav>
  <div class="spacer"></div>
  {% if me %}
  <div class="foot">
    Signed in as <strong>{{ me.name }}</strong>
    <form method="post" action="/ui/logout">
      {{ csrf_field() }}
      <button class="small ghost" type="submit">Sign out</button>
    </form>
  </div>
  {% endif %}
</aside>
