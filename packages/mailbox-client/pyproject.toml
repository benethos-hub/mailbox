[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benethos-mailbox-client"
version = "0.3.1"
description = "Python client of the REST API of mailbox-service: the mail of all your mailboxes (IMAP, JMAP, POP3, Gmail, Microsoft 365, Outlook.com) through one API, async and sync."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benedikt Oswald" }]
keywords = [
    "email",
    "imap",
    "jmap",
    "pop3",
    "gmail",
    "outlook",
    "microsoft-365",
    "multi-account",
    "rest-client",
    "api-client",
    "email-automation",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# One library: the client speaks HTTP and nothing else. It knows the
# service only through its REST API.
dependencies = [
    # The minimum is a version without a known vulnerability: the job
    # lowest-versions of ci.yml checks it against OSV.
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/benethos-hub/mailbox/tree/main/packages/mailbox-client#readme"
Repository = "https://github.com/benethos-hub/mailbox"
Issues = "https://github.com/benethos-hub/mailbox/issues"
Changelog = "https://github.com/benethos-hub/mailbox/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/benethos_mailbox_client"]
