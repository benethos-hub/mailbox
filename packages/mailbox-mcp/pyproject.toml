[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benethos-mailbox-mcp"
version = "0.1.0"
description = "MCP server that gives AI assistants such as Claude your mailboxes through the Mailbox Service, limited to what its token may do. Over stdio or HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benedikt Oswald" }]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "claude",
    "ai-assistant",
    "llm-tools",
    "email",
    "imap",
    "outlook",
    "microsoft-365",
    "multi-account",
    "email-automation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Deliberately small: no service package, no mail libraries. Everything this
# server knows about mail it learns from the REST API.
dependencies = [
    # Plain `mcp`, not `mcp[cli]`: the extra only adds the `mcp` command and
    # its dependencies. It lives in the workspace dev group.
    "mcp>=2.0.0,<3",
    "httpx>=0.28",
    # PDF attachments reach the model as page images (pdf.py).
    "pypdfium2>=4.30",
    # The HTTP transport (transport.py); mcp brings it too.
    "uvicorn>=0.31",
]

[project.urls]
Homepage = "https://github.com/benethos-hub/mailbox/tree/main/packages/mailbox-mcp#readme"
Repository = "https://github.com/benethos-hub/mailbox"
Issues = "https://github.com/benethos-hub/mailbox/issues"
Changelog = "https://github.com/benethos-hub/mailbox/blob/main/CHANGELOG.md"

[project.scripts]
benethos-mailbox-mcp = "benethos_mailbox_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benethos_mailbox_mcp"]
