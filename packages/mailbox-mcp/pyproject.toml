[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benethos-mailbox-mcp"
version = "0.3.1"
description = "MCP server that gives AI agents your mailboxes through mailbox-service: read, sort, draft and send mail, only within the rights, folders and send limits its token holds. Over stdio or HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benedikt Oswald" }]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ai-agents",
    "llm",
    "email",
    "imap",
    "jmap",
    "pop3",
    "gmail",
    "outlook",
    "microsoft-365",
    "multi-account",
    "email-automation",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Deliberately small: no service package, no mail libraries. Everything this
# server knows about mail it learns from the REST API.
dependencies = [
    # Each minimum is a version without a known vulnerability: the job
    # lowest-versions of ci.yml checks them against OSV.
    # Plain `mcp`, not `mcp[cli]`: the extra only adds the `mcp` command and
    # its dependencies. It lives in the workspace dev group.
    "mcp>=2.0.0,<3",
    # The REST client. Released with this package under the same version.
    "benethos-mailbox-client==0.3.1",
    # PDF attachments reach the model as page images (pdf.py).
    "pypdfium2>=4.30",
    # The HTTP transport (transport.py); mcp brings it too.
    "uvicorn>=0.31",
    # Imported here as well, though mcp brings them: the ASGI types of the
    # transport, the tools' cancel scopes and their fields.
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "pydantic>=2.12",
    # The settings folder of the operating system (config.py).
    "platformdirs>=4.3",
    # The optional settings file (config.py), read as the service reads its own.
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/benethos-hub/mailbox/tree/main/packages/mailbox-mcp#readme"
Repository = "https://github.com/benethos-hub/mailbox"
Issues = "https://github.com/benethos-hub/mailbox/issues"
Changelog = "https://github.com/benethos-hub/mailbox/blob/main/CHANGELOG.md"

[project.scripts]
benethos-mailbox-mcp = "benethos_mailbox_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benethos_mailbox_mcp"]
