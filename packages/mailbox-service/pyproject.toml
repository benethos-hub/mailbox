[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benethos-mailbox-service"
version = "0.1.0"
description = "Self-hosted mail service: one REST API and a web UI for IMAP and Microsoft 365 / Outlook.com accounts, with users, rights and encrypted credentials."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benedikt Oswald" }]
keywords = [
    "email",
    "mail",
    "imap",
    "smtp",
    "microsoft-graph",
    "outlook",
    "microsoft-365",
    "rest-api",
    "openapi",
    "fastapi",
    "oauth2",
    "multi-account",
    "self-hosted",
    "email-automation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = [
    "fastapi>=0.129.1",
    "uvicorn>=0.38",
    # The configuration UI: server-rendered pages (web/pages/) and their
    # forms.
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    # Outbound HTTP: autodiscovery, later the Gmail and Microsoft Graph
    # adapters.
    "httpx>=0.28",
    # AES-256-GCM for stored credentials.
    "cryptography>=44",
    # The OS credential store that holds the master key on a host.
    "keyring>=25",
    # IMAP: search builder, message parsing, folder name decoding.
    "imap-tools>=1.10",
    # Worker threads for the synchronous IMAP library.
    "anyio>=4",
    # Autodiscovery: MX and SRV lookups.
    "dnspython>=2.6",
    # Autodiscovery: autoconfig XML without entity expansion.
    "defusedxml>=0.7.1",
    # Autodiscovery: where a domain ends. Ships its own copy of the list.
    "publicsuffixlist>=1.0",
    "imapclient>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/benethos-hub/mailbox/tree/main/packages/mailbox-service#readme"
Repository = "https://github.com/benethos-hub/mailbox"
Issues = "https://github.com/benethos-hub/mailbox/issues"
Changelog = "https://github.com/benethos-hub/mailbox/blob/main/CHANGELOG.md"

[project.scripts]
benethos-mailbox-service = "benethos_mailbox_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benethos_mailbox_service"]
