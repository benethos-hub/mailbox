{# The shell of a page outside the layout: signing in, and the bounce
   back from a provider. #}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% block head %}{% endblock %}
    <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
    <link rel="icon" href="/ui/static/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/ui/static/css/app.css" />
  </head>
  <body>
    <div class="signin">
      <picture class="logo">
        <source srcset="/ui/static/img/logo-dark.svg" media="(prefers-color-scheme: dark)" />
        <img src="/ui/static/img/logo.svg" alt="{{ APP_NAME }}" width="212" height="72" />
      </picture>
      <section class="card">
        <header><h2>{% block heading %}{{ APP_NAME }}{% endblock %}</h2></header>
        <div class="body">
          {% block content %}{% endblock %}
        </div>
      </section>
    </div>
  </body>
</html>
