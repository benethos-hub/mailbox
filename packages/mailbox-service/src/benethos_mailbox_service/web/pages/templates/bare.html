{# The shell of a page outside the layout: signing in, and the bounce
   back from a provider. #}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% block head %}{% endblock %}
    <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
    <link rel="stylesheet" href="/ui/static/css/app.css" />
  </head>
  <body>
    <div class="signin">
      <section class="card">
        <header><h2>✉ {{ APP_NAME }}{% block subtitle %}{% endblock %}</h2></header>
        <div class="body">
          {% block content %}{% endblock %}
        </div>
      </section>
    </div>
  </body>
</html>
