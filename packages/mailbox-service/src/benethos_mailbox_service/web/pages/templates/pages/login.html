{% extends "bare.html" %}
{% block title %}Sign in · {{ APP_NAME }}{% endblock %}
{% block heading %}Sign in{% endblock %}
{% block content %}
{% include "partials/flash.html" %}
<form method="post" action="/ui/login">
  <input type="hidden" name="nonce" value="{{ nonce }}" />
  <input type="hidden" name="next" value="{{ next }}" />
  <div class="field">
    <label for="f-name">User name</label>
    <input id="f-name" name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
  </div>
  <div class="field">
    <label for="f-password">Password</label>
    <input id="f-password" name="password" type="password" autocomplete="current-password" required />
  </div>
  <div class="form-actions">
    <button class="primary" type="submit">Sign in</button>
  </div>
</form>
{% endblock %}
