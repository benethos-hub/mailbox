{% extends "bare.html" %}
{% block title %}Sign in · {{ APP_NAME }}{% endblock %}
{% block subtitle %} · Sign in{% endblock %}
{% block content %}
{% include "partials/flash.html" %}
<form method="post" action="/ui/login">
  <input type="hidden" name="nonce" value="{{ nonce }}" />
  <input type="hidden" name="next" value="{{ next }}" />
  <div class="field">
    <label for="f-token">API token</label>
    <input id="f-token" name="token" type="password" autocomplete="current-password" required autofocus />
    <span class="hint">A token of your user, or the admin key. You act with the rights of that user.</span>
  </div>
  <div class="form-actions">
    <button class="primary" type="submit">Sign in</button>
  </div>
</form>
{% endblock %}
