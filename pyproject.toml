# Workspace root. Not a package itself: it holds the three distributions
# under packages/, the shared development tools and the tool configuration.
#
#   packages/mailbox-service  the service: REST API, adapters, credential store
#   packages/mailbox-client   the Python client of the REST API
#   packages/mailbox-mcp      the MCP server, on top of the client
#
# Neither the client nor the MCP package depends on the service package.
# That is what keeps them REST clients: they cannot import an adapter
# because they cannot see one.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
benethos-mailbox-service = { workspace = true }
benethos-mailbox-mcp = { workspace = true }
benethos-mailbox-client = { workspace = true }

[dependency-groups]
dev = [
    "benethos-mailbox-service",
    "benethos-mailbox-mcp",
    "benethos-mailbox-client",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
    "mypy>=2.1.0",
    # Gives back the `mcp` command, whose `mcp dev` runs a server against the
    # MCP Inspector.
    "mcp[cli]>=2.3.0,<3",
    "types-defusedxml>=0.7",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/mailbox-service/tests",
    "packages/mailbox-client/tests",
    "packages/mailbox-mcp/tests",
]
asyncio_mode = "auto"
# The packages have tests with the same file names (test_cli.py, ...).
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = [
    "benethos_mailbox_service",
    "benethos_mailbox_client",
    "benethos_mailbox_mcp",
]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "W",    # pycodestyle warnings
    "N",    # pep8-naming
    "C90",  # mccabe: the complexity of a function
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "S101",  # assert: gone under python -O, so never a check of the code
]

[tool.ruff.lint.per-file-ignores]
# A test and a live check say what they expect with assert.
"packages/*/tests/**" = ["S101"]
"live/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.pep8-naming]
# A method of logging.Formatter: the standard library names it.
extend-ignore-names = ["formatTime"]

[tool.mypy]
python_version = "3.11"
files = [
    "packages/mailbox-service/src",
    "packages/mailbox-client/src",
    "packages/mailbox-mcp/src",
    # The live checks run by hand: a break shows here, not in a run.
    "live",
]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Ships no type information.
module = ["publicsuffixlist", "imapclient", "imapclient.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
